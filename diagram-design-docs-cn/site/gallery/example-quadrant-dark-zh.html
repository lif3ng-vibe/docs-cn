<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content ideas · Impact × Effort</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', ui-monospace, 'PingFang SC', 'Microsoft YaHei', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quadrant · Diagram Design</p>
    <h1>Content ideas · Impact × Effort</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quadrant-dark-title quadrant-dark-desc">
      <title id="quadrant-dark-title">Content ideas · Impact × Effort</title>
      <desc id="quadrant-dark-desc">Impact-effort matrix showing eight content projects across do first, major projects, quick wins, and avoid quadrants.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Quadrant backgrounds (very subtle, only coral on DO FIRST) -->
        <rect x="120" y="80" width="380" height="170" fill="rgba(240,138,89,0.03)"/>

        <!-- Axis cross -->
        <line x1="120" y1="250" x2="880" y2="250" stroke="rgba(245,245,245,0.45)" stroke-width="1"/>
        <line x1="500" y1="80" x2="500" y2="420" stroke="rgba(245,245,245,0.45)" stroke-width="1"/>

        <!-- Axis end labels -->
        <text x="880" y="266" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">高投入 →</text>
        <text x="120" y="266" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">← LOW EFFORT</text>
        <text x="512" y="80" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">↑ HIGH IMPACT</text>
        <text x="512" y="432" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">↓ LOW IMPACT</text>

        <!-- Quadrant corner labels -->
        <text x="140" y="104" fill="#f08a59" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em" font-weight="600">优先做</text>
        <text x="860" y="104" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">重大项目</text>
        <text x="140" y="412" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">快赢事项</text>
        <text x="860" y="412" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">AVOID</text>

        <!-- Items: TL (Do First) -->
        <!-- coral focal -->
        <circle cx="220" cy="140" r="6" fill="#f08a59"/>
        <text x="232" y="144" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Schematic skill v4</text>

        <circle cx="320" cy="200" r="4" fill="#f5f5f5"/>
        <text x="332" y="204" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">更新变更日志</text>

        <!-- Items: TR (Major Projects) -->
        <circle cx="620" cy="140" r="4" fill="#f5f5f5"/>
        <text x="632" y="144" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">Design v4 改版</text>

        <circle cx="760" cy="180" r="4" fill="#f5f5f5"/>
        <text x="772" y="184" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">新刊物</text>

        <!-- Items: BL (Quick Wins) -->
        <circle cx="260" cy="320" r="4" fill="#f5f5f5"/>
        <text x="272" y="324" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">修复页脚链接</text>

        <circle cx="360" cy="380" r="4" fill="#f5f5f5"/>
        <text x="372" y="384" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">更新 OG 标签</text>

        <!-- Items: BR (Avoid) -->
        <circle cx="640" cy="380" r="4" fill="#f5f5f5"/>
        <text x="652" y="384" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">重写构建管线</text>

        <circle cx="780" cy="320" r="4" fill="#f5f5f5"/>
        <text x="792" y="324" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">迁移到 Nuxt</text>

        <!-- Legend -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="52" cy="488" r="6" fill="#f08a59"/>
        <text x="68" y="492" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">明天启动</text>

        <circle cx="192" cy="488" r="4" fill="#f5f5f5"/>
        <text x="208" y="492" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">候选项目</text>

        <text x="336" y="492" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">位置才是信号。颜色留给唯一的行动项。</text>
      </svg>
  </div>
</body>
</html>
