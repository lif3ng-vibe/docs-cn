name: 翻译文档站
description: 提交英文文档站汉化任务——由有写权限的人打上 translate label 后，CI 自动翻译并开 PR
title: "[translate] <站点名>"
labels: ["translate-request"]
body:
  - type: markdown
    attributes:
      value: |
        填完后**不会自动启动**：需要由有写权限的人补打 `translate` label 才触发 CI 翻译（防外部 issue 烧 token）。
        - **有源码仓库（推荐）**：填「上游 git 仓库」，按 Markdown 源翻译，质量最好
        - **闭源站**：上游仓库留空即可，CI 走「抓站 → HTML 就地翻译 → 静态镜像」模式；正文全靠 JS 渲染的站 CI 会先回帖问询
        - CI 遇到不确定的点会回帖并打 `needs-input` label——**回复 `/reply <你的答复>`（或 `/continue`）即继续执行**，进度不丢
        - PR 创建后仍可继续回复 `/reply 修改：…` 迭代，CI 会更新同一个 PR
        - 大站（>150 页）务必填「范围裁剪」，否则 CI 会回帖询问
        - 额度耗尽回帖 quota-blocked，额度恢复后 `/continue` 断点续跑
  - type: input
    id: upstream-repo
    attributes:
      label: 上游 git 仓库 URL
      description: 有源码仓库填这里（GitHub Pages 站点找 footer 链接或同名 repo）；闭源站留空走镜像模式
      placeholder: https://github.com/user/repo（闭源站留空）
    validations:
      required: false
  - type: input
    id: docs-url
    attributes:
      label: 文档站 URL
      placeholder: https://docs.example.com
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: 站点 slug
      description: 项目目录 <slug>-docs-cn，Pages 路径 /docs-cn/<slug>/；留空自动从仓库名/域名推导
      placeholder: handy（留空自动推导）
    validations:
      required: false
  - type: input
    id: subdir
    attributes:
      label: 仓库内文档子目录
      description: monorepo 时填文档所在目录（如 site/ 或 docs/），站根仓库留空
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 范围裁剪
      description: 只翻译部分目录/限抓页数时填（如「仅 docs/guides/」「≤80 页」）；留空 = 全站（≤150 页）
    validations:
      required: false
  - type: textarea
    id: glossary
    attributes:
      label: 术语约定补充
      description: 特殊译法/不译清单，会并入 GLOSSARY.md；留空按 skill 默认术语策略
    validations:
      required: false
