name: Translate docs site (issue 触发)

# issue 表单 + translate label 触发翻译；/continue 或 /reply <答复> 评论从
# translate/<slug> 分支 checkpoint 续跑（/reply 兼作对 claude 提问的答复与
# PR 后的迭代修改指令）。上游仓库可空——闭源站走「抓站→HTML 就地翻译→静态
# 镜像」模式（见 publishing-docs-cn「CI 模式」的闭源站节）。产出 = PR（阶段
# A+B+C），人工 review 合并 master 后由既有 deploy-pages.yml 上线。
#
# 防护与约定：
# - 门禁：触发者必须对仓库有写权限（防外部 issue / 评论烧 token）
# - 并发：全局串行（group: translate），重触发取消旧 run——并行是 429 主因，
#   checkpoint 每批都推，被取消最多丢当前未提交批
# - 状态契约：claude 把本轮结局写进 <slug>-docs-cn/.translation-state/STATUS
#   （done=建 PR；paused:needs-input/paused:quota=claude 已回帖，等用户 /reply
#   或 /continue，本 run 正常结束不建 PR 不发兜底评论）
# - 429：瞬时 429 由 CLI 内建退避消化；持续耗尽回帖 quota-blocked；功能死局
#   回帖 blocked。注意 job 级 timeout 到点直接杀死整 job，兜底回帖不会执行，
#   此场景直接 /continue 即可（checkpoint 已推）
# - 硬超时 timeout-minutes: 350（GitHub job 上限 360，留余量）
# - claude 走自定义中转端点：secrets ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN
#   （可选 ANTHROPIC_MODEL 指定中转端模型名）

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: '翻译任务 issue 编号'
        required: true
        type: string

concurrency:
  group: translate
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 触发门禁（类型过滤 + 写权限校验）
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          COMMENT: ${{ github.event.comment.body }}
          SENDER: ${{ github.event.sender.login }}
          DISPATCH_ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          SKIP=0
          case "$EVENT" in
            issues)
              if [ "$LABEL" != "translate" ]; then
                echo "label=[$LABEL] 非 translate，跳过（run step 的 exit 78 不产生 neutral，用 DOCS_RUN 标志跳过剩余步骤保持绿）"
                SKIP=1
              else
                ISSUE_NUMBER="${{ github.event.issue.number }}"
              fi
              ;;
            issue_comment)
              TRIMMED="$(printf '%s' "$COMMENT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              case "$TRIMMED" in
                /continue|/reply*) ISSUE_NUMBER="${{ github.event.issue.number }}" ;;
                *) echo "非 /continue、/reply 评论，跳过"
                   SKIP=1 ;;
              esac
              ;;
            workflow_dispatch)
              ISSUE_NUMBER="$DISPATCH_ISSUE"
              ;;
            *)
              echo "未知事件 $EVENT，跳过"
              SKIP=1
              ;;
          esac
          if [ "$SKIP" = "1" ]; then
            echo "DOCS_RUN=false" >> "$GITHUB_ENV"
            exit 0
          fi
          PERM="$(gh api "repos/${{ github.repository }}/collaborators/$SENDER/permission" --jq .permission)"
          case "$PERM" in
            admin|maintain|write) ;;
            *) echo "::error::触发者 $SENDER 对本仓库无写权限（$PERM），拒绝执行"; exit 1 ;;
          esac
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"
          echo "DOCS_RUN=true" >> "$GITHUB_ENV"

      - name: checkout hub（PAT 持久凭据，供 checkpoint push）
        if: env.DOCS_RUN != 'false'
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.DOCS_CN_PAT || github.token }}
          fetch-depth: 1

      - name: 拉取 issue 并解析表单
        if: env.DOCS_RUN != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json title --jq .title
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > issue-body.md
          node scripts/ci-parse-translate-issue.mjs issue-body.md >> "$GITHUB_ENV"

      - name: 配置 git 身份 + 续跑检测
        if: env.DOCS_RUN != 'false'
        run: |
          set -euo pipefail
          git config user.name "lifeng"
          git config user.email "294916781@qq.com"
          BRANCH="translate/$SLUG"
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            git fetch --depth=50 origin "$BRANCH"
            git checkout "$BRANCH"
            echo "RESUME=1" >> "$GITHUB_ENV"
            echo "续跑模式：检出既有 $BRANCH"
          else
            git checkout -B "$BRANCH"
            echo "RESUME=0" >> "$GITHUB_ENV"
            echo "全新开工：创建 $BRANCH"
          fi

      - name: Push 权限预检（普通内容 + workflow 文件，失败即终止不进翻译）
        id: preflight
        if: env.DOCS_RUN != 'false'
        run: |
          set -euo pipefail
          # 第一关：普通内容推送（凭据基本有效性）
          git push origin "translate/$SLUG"
          # 第二关：workflow 文件推送（推 deploy-pages.yml 构建段所需，fine-grained PAT
          # 需 Workflows: Read and write）。临时文件用点前缀名不会被注册成 workflow，
          # 加减两个 commit 后 PR diff 净值为零。
          echo 'on: null' > .github/workflows/.push-preflight.yml
          git add .github/workflows/.push-preflight.yml
          git commit -q -m "ci: push 权限预检临时文件（随后移除）"
          if git push origin "translate/$SLUG" 2>/tmp/preflight-err.log; then
            git rm -q .github/workflows/.push-preflight.yml
            git commit -q -m "ci: 移除 push 预检临时文件"
            git push -q origin "translate/$SLUG"
            echo "✅ push 预检通过：普通内容与 workflow 文件均可推送"
          else
            echo "::error::Push 预检失败——凭据推不了 workflow 文件。原始报错："
            cat /tmp/preflight-err.log
            exit 1
          fi

      - name: 预检失败回帖（终止，未进翻译零 token 消耗）
        if: failure() && steps.preflight.outcome == 'failure' && env.DOCS_RUN != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "Push 权限预检失败 ⛔ 已在翻译开始前终止（零 token 消耗）。

          checkout 凭据推不了分支或 workflow 文件。请检查那枚 fine-grained PAT（GitHub → Settings → Developer settings → Fine-grained tokens）：
          - **Contents: Read and write**（推普通内容）
          - **Workflows: Read and write**（推 deploy-pages.yml 构建段——最常漏）
          - Repository access 含 docs-cn / docs-cn-1 / docs-cn-2 三仓

          修好后无需改 issue：重新 dispatch（gh workflow run translate-on-issue.yml -f issue=${ISSUE_NUMBER}）或直接评论 \`/continue\`，预检通过才进翻译。"
          gh issue edit "$ISSUE_NUMBER" --add-label blocked || true

      - uses: actions/setup-node@v4
        if: env.DOCS_RUN != 'false'
        with:
          node-version: '22'

      - name: 安装 Claude Code CLI
        if: env.DOCS_RUN != 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: 运行翻译（阶段 A+B+C，按 publishing-docs-cn CI 模式）
        if: env.DOCS_RUN != 'false'
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          DOCS_URL: ${{ env.DOCS_URL }}
          SLUG: ${{ env.SLUG }}
          SUBDIR: ${{ env.SUBDIR }}
          SCOPE: ${{ env.SCOPE }}
          GLOSSARY_NOTES: ${{ env.GLOSSARY_NOTES }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          RESUME: ${{ env.RESUME }}
        run: |
          set -o pipefail
          PROMPT="$(cat <<EOF
          你是本仓库（docs-cn hub）的文档站汉化执行器。先读 .claude/skills/publishing-docs-cn/SKILL.md 与 .claude/skills/translate-docs-site/SKILL.md，按 publishing-docs-cn 的「CI 模式」执行阶段 A+B+C：翻译 → 带 base 构建演练 → 五处同步入 hub。不要创建 PR，不要 push master，不要动 docs-compare；PR 由 workflow 创建。

          任务参数（来自 issue 表单，workflow 已解析）：
          - 上游 git 仓库：${UPSTREAM_REPO:-无——闭源站}
          - 文档站 URL：${DOCS_URL}
          - 站点 slug：${SLUG}（项目目录 ./${SLUG}-docs-cn/ 建在仓库根；Pages 路径 /docs-cn/${SLUG}/）
          - 仓库内文档子目录：${SUBDIR:-无}
          - 范围裁剪：${SCOPE:-全站}
          - 术语补充：${GLOSSARY_NOTES:-无}
          - 上线方式：${DEPLOY_MODE}（auto=workflow 在 STATUS=done 后自动合并 master 并部署；review=建 PR 等人工）
          - 任务 issue：#${ISSUE_NUMBER}

          上游仓库为空时走「CI 模式协议」的「闭源站模式」：抓站 → HTML 就地翻译 → 静态镜像交付，管线细节与红线以 SKILL 该节为准。

          RESUME=${RESUME}。=1 时先走开工探测：读 ./${SLUG}-docs-cn/.translation-state/progress.md 与 gh issue view ${ISSUE_NUMBER} --comments，git 已提交内容为权威，绝不重译已 commit 批次；issue 线程里用户的回复（/reply 文字）= 对你的指令，逐条落实后再继续；=0 时全新开工。

          不确定点协议（两种模式都适用）：遇到拿不准的事（站点结构异常、JS 渲染抓不到正文、疑似反爬、规模超限、多方案难取舍）——不许猜：gh issue comment ${ISSUE_NUMBER} 提出具体问题（附证据与候选项）→ gh issue edit ${ISSUE_NUMBER} --add-label needs-input → STATUS 写 paused:needs-input → checkpoint push → 正常退出。用户回复 /reply 或 /continue 后新 run 会带着答复续跑。

          状态契约：./${SLUG}-docs-cn/.translation-state/STATUS 记录本轮结局——阶段 C 完成写 done；暂停等输入写 paused:needs-input；额度耗尽写 paused:quota。每次 checkpoint push 带上最新 STATUS。

          硬性边界（违者本轮作废）：
          - 只允许 push translate/${SLUG} 分支；git 身份已配置好，直接用
          - push 一律用 origin 预配凭据（DOCS_CN_PAT，含 workflows 写权限），禁止用 GH_TOKEN 拼带 token 的 URL 推 git——App token 有 contents 但 GitHub 硬性禁止它推 workflow 文件
          - 每批 commit 后立即 git push origin HEAD，并 gh issue comment ${ISSUE_NUMBER} 回帖一行进度（批次名/页数/状态）
          - progress.md、.anchor-maps/、GLOSSARY.md 随批提交；dist 与 node_modules 不进 git
          - 持续 429 / 额度耗尽：按 429 协议回帖（已完成/剩余/如何 /continue）+ 打 quota-blocked label + STATUS 写 paused:quota 后正常退出；功能死局（要改需求才能继续）用 blocked label
          - 阶段 C 五处同步提交后、最终 push 前：git fetch origin master 并 git merge --no-edit origin/master 把最新 master 并进分支（冲突规则：sites.json 双方条目并存并重跑 node scripts/gen-index.cjs、README 双方段落并存），再最终 push → STATUS 写 done → 回帖一行总结即结束
          EOF
          )"
          ARGS=(--dangerously-skip-permissions)
          if [ -n "${ANTHROPIC_MODEL:-}" ]; then ARGS+=(--model "$ANTHROPIC_MODEL"); fi
          set +e
          claude -p "$PROMPT" "${ARGS[@]}" 2>&1 | tee claude-run.log
          CODE="${PIPESTATUS[0]}"
          set -e
          echo "CLAUDE_CODE=$CODE" >> "$GITHUB_ENV"
          # 无论成败都继续跑后续回帖步骤，成败判定在下方各步 if 里
          exit 0

      - name: 读取状态契约（done / paused:*）
        if: success() && env.CLAUDE_CODE == '0'
        run: |
          STATUS="$(cat "${SLUG}-docs-cn/.translation-state/STATUS" 2>/dev/null || echo unknown)"
          echo "CLAUDE_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "claude 退出码=$CLAUDE_CODE，STATUS=$STATUS"

      - name: 暂停等待用户输入（claude 已回帖提问，本 run 正常结束）
        if: success() && env.CLAUDE_CODE == '0' && startsWith(env.CLAUDE_STATUS, 'paused')
        run: |
          echo "STATUS=${CLAUDE_STATUS}——claude 已在 issue #${ISSUE_NUMBER} 回帖说明并打 label。"
          echo "用户回复 /reply <答复> 或 /continue 后由新 run 断点续跑；本 run 不建 PR、正常结束。"

      - name: 产物校验（项目目录 + sites.json 收录）
        if: success() && env.CLAUDE_CODE == '0' && env.CLAUDE_STATUS == 'done'
        run: |
          set -euo pipefail
          [ -d "${SLUG}-docs-cn" ] || { echo "::error::项目目录 ${SLUG}-docs-cn 不存在"; exit 1; }
          SLUG="$SLUG" node -e 'const j=JSON.parse(require("fs").readFileSync("sites.json","utf8"));const a=Array.isArray(j)?j:(j.sites||[]);if(!a.some(x=>x.slug===process.env.SLUG)){console.error("sites.json 未含 "+process.env.SLUG+"（阶段C 未完成）");process.exit(1)}'
          echo "产物校验通过"

      - name: 兜底残留提交 + 最终 push
        if: success() && env.CLAUDE_CODE == '0' && env.CLAUDE_STATUS == 'done'
        run: |
          set -euo pipefail
          git add -A -- "${SLUG}-docs-cn"
          if ! git diff --cached --quiet; then
            git commit -m "checkpoint: workflow 收尾兜底（issue #${ISSUE_NUMBER}）"
          fi
          git push origin "translate/$SLUG"

      - name: 自动合并上线（auto 模式：合入 master 触发部署）
        if: success() && env.CLAUDE_CODE == '0' && env.CLAUDE_STATUS == 'done' && env.DEPLOY_MODE == 'auto'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin master
          if git merge --no-edit origin/master; then
            # 推送走 checkout 预配的 PAT 凭据——GITHUB_TOKEN 推 master 不会触发 deploy-pages
            git push origin "HEAD:master"
            gh issue comment "$ISSUE_NUMBER" --body "已自动合并进 master ✅ deploy-pages 部署已触发，几分钟后上线 https://lif3ng-vibe.github.io/docs-cn/${SLUG}/（新站首轮冷同步可能要 20 分钟）。对照登记（docs-compare）留待本地进行。"
            gh issue edit "$ISSUE_NUMBER" --remove-label translate || true
            gh issue edit "$ISSUE_NUMBER" --remove-label needs-input || true
            gh issue edit "$ISSUE_NUMBER" --add-label deployed || true
            echo "✅ 自动合并完成"
          else
            git merge --abort || true
            gh issue comment "$ISSUE_NUMBER" --body "自动合并被冲突挡住 ⛔ 分支与 master 冲突（通常是 sites.json/README 相邻条目）。评论 \`/continue\`，claude 解冲突（规则：双方条目并存 + 重跑 gen-index）后再走合并。"
            gh issue edit "$ISSUE_NUMBER" --add-label needs-input || true
            echo "合并冲突，已回帖等 /continue"
          fi

      - name: 创建 PR + 回帖 + 收 label（review 模式）
        if: success() && env.CLAUDE_CODE == '0' && env.CLAUDE_STATUS == 'done' && env.DEPLOY_MODE != 'auto'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > pr-body.md <<EOF
          ## 汉化收录：${SLUG}

          由 issue #${ISSUE_NUMBER} 触发的 CI 翻译产出（publishing-docs-cn CI 模式，阶段 A+B+C）。

          - 上游仓库：${UPSTREAM_REPO}
          - 文档站：${DOCS_URL}
          - Pages 路径（合并后）：/docs-cn/${SLUG}/

          **合并即上线**：本 PR 合入 master 会自动触发 hub deploy-pages.yml 构建部署。
          compare 对照登记（docs-compare 五处同步 + 锚点表）按惯例在本地进行。
          EOF
          cat > done-body.md <<EOF
          翻译完成 ✅ 阶段 A+B+C 已交付：**PR 见上方关联链接**，请 review 后合并（合并即触发部署上线）。

          - 翻译全程按批 commit + checkpoint 推送，进度与锚点映射都在 translate/${SLUG} 分支历史里
          - 对照登记（docs-compare）留待本地进行
          EOF
          PR_URL="$(gh pr list --head "translate/$SLUG" --state open --json url --jq '.[0].url')"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create --base master --head "translate/$SLUG" --title "汉化收录：${SLUG}（issue #${ISSUE_NUMBER}）" --body-file pr-body.md)"
          fi
          DONE_BODY="$(sed "s|PR 见上方关联链接|PR：$PR_URL|" done-body.md)"
          printf '%s\n' "$DONE_BODY" > done-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file done-body.md
          gh issue edit "$ISSUE_NUMBER" --remove-label translate || true
          gh issue edit "$ISSUE_NUMBER" --remove-label blocked || true
          gh issue edit "$ISSUE_NUMBER" --remove-label quota-blocked || true
          gh issue edit "$ISSUE_NUMBER" --remove-label needs-input || true
          gh issue edit "$ISSUE_NUMBER" --add-label awaiting-review || true

      - name: 失败回帖（429/静默退出 → quota-blocked；其他 → blocked + /continue 指引）
        if: always() && env.CLAUDE_CODE != '' && (env.CLAUDE_CODE != '0' || failure() || env.CLAUDE_STATUS == 'unknown')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f claude-run.log ] \
             && grep -Eiq '429|rate.?limit|quota|insufficient|credit|usage limit' claude-run.log; then
            LABEL="quota-blocked"
            REASON="额度/限流耗尽（上游端点持续 429 或 credit 不足）"
            NEXT="等额度恢复后在本 issue 评论 \`/continue\`，CI 会从最后一次 checkpoint 断点续跑，已完成批次不会重译。"
          elif [ "${CLAUDE_CODE}" = "0" ] && [ "${CLAUDE_STATUS}" = "unknown" ]; then
            LABEL="quota-blocked"
            REASON="claude 中途静默退出（退出码 0 但未按状态契约写 STATUS，通常死在批次中途）——常见为端点断流或额度耗尽"
            NEXT="评论 \`/continue\` 从断点续跑（已完成批次不会重译）；反复出现请检查中转端点额度与稳定性。"
          elif [ "${CLAUDE_CODE}" != "0" ]; then
            LABEL="blocked"
            REASON="翻译进程异常退出（退出码 ${CLAUDE_CODE}）"
            NEXT="检查下方日志末尾定位原因；处理后在评论 \`/continue\` 从断点续跑。"
          else
            LABEL="blocked"
            REASON="翻译进程正常退出，但收尾阶段失败（产物校验 / 兜底提交 / 合并或 PR 创建之一）"
            NEXT="常见三种：① 交付物问题——\`/continue\` 从断点续跑修复；② 合并冲突——\`/continue\` 后 claude 解冲突（双方条目并存）；③ 若日志见 GitHub Actions is not permitted to create or approve pull requests——仓库 Settings → Actions → General 取消勾选「Forbid GitHub Actions from creating or approving pull requests」后重跑。看 run 日志定位。"
          fi
          {
            echo "翻译中断 ⛔ ${REASON}"
            echo
            echo "${NEXT}"
            echo
            echo "<details><summary>日志末尾（点击展开）</summary>"
            echo
            echo '```'
            if [ -f claude-run.log ]; then tail -c 4000 claude-run.log; else echo "（无日志文件）"; fi
            echo '```'
            echo "</details>"
          } > fail-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file fail-body.md
          gh issue edit "$ISSUE_NUMBER" --add-label "$LABEL" || true

      - name: 失败转红（回帖已发，job 状态要如实）
        if: always() && env.CLAUDE_CODE != '' && env.CLAUDE_CODE != '0'
        run: |
          echo "::error::claude 退出码 $CLAUDE_CODE——失败详情与 /continue 指引见 issue #${ISSUE_NUMBER} 回帖"
          exit 1
