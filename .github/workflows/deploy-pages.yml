name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 允许 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一条部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            codegraph-docs-cn/package-lock.json
            orca-docs-cn/package-lock.json
            mattpocock-skills-docs-cn/package-lock.json
            ai-coding-dictionary-docs-cn/package-lock.json
            ai-memory-docs-cn/package-lock.json
            ai-memory-docs-en/package-lock.json
            openrig-docs-cn/package-lock.json
            openrig-docs-en/package-lock.json

      - name: Build codegraph-docs-cn
        working-directory: codegraph-docs-cn
        env:
          DOCS_BASE: /docs-cn/codegraph/
        run: |
          # 正文 markdown 内链 ](/path) 加 base 前缀（Astro 对 markdown 内链不会自动加 base，
          # 只对 Starlight 组件链接加；源码保持 ](/) 不带前缀，仅 CI 临时加前缀）
          find src/content/docs -name '*.md' -exec sed -i 's|\](/|\](/docs-cn/codegraph/|g' {} +
          npm ci
          npm run build

      - name: Build orca-docs-cn
        working-directory: orca-docs-cn
        env:
          DOCS_BASE: /docs-cn/orca/
        run: |
          find src/content/docs -name '*.md' -exec sed -i 's|\](/|\](/docs-cn/orca/|g' {} +
          npm ci
          npm run build

      - name: Build mattpocock-skills-docs-cn
        working-directory: mattpocock-skills-docs-cn
        env:
          DOCS_BASE: /docs-cn/mattpocock-skills/
        run: |
          find src/content/docs -name '*.md' -exec sed -i 's|\](/|\](/docs-cn/mattpocock-skills/|g' {} +
          npm ci
          npm run build

      - name: Build ai-coding-dictionary-docs-cn
        working-directory: ai-coding-dictionary-docs-cn
        env:
          DOCS_BASE: /docs-cn/ai-coding-dictionary/
        run: |
          find src/content/docs -name '*.md' -exec sed -i 's|\](/|\](/docs-cn/ai-coding-dictionary/|g' {} +
          npm ci
          npm run build

      - name: Build ai-memory-docs-cn
        working-directory: ai-memory-docs-cn
        env:
          DOCS_BASE: /docs-cn/ai-memory/
        run: |
          find src/content/docs -name '*.md' -exec sed -i 's|\](/|\](/docs-cn/ai-memory/|g' {} +
          npm ci
          npm run build

      - name: Build ai-memory-docs-en
        working-directory: ai-memory-docs-en
        env:
          DOCS_BASE: /docs-cn/ai-memory-en/
        run: |
          find src/content/docs -name '*.md' -exec sed -i 's|\](/|\](/docs-cn/ai-memory-en/|g' {} +
          npm ci
          npm run build

      # openrig 是标准 Starlight + npm；正文 md/mdx 内链 ](/…) 与 index.mdx hero 的
      # YAML link: '/… 都需 CI 临时加 base 前缀（组件链接 Astro 会自动加，正文不会）。
      - name: Build openrig-docs-cn
        working-directory: openrig-docs-cn
        env:
          DOCS_SITE: https://lif3ng-vibe.github.io
          DOCS_BASE: /docs-cn/openrig/
        run: |
          find src/content/docs -name '*.md' -exec sed -i 's|\](/|\](/docs-cn/openrig/|g' {} +
          find src/content/docs -name '*.mdx' -exec sed -i 's|\](/|\](/docs-cn/openrig/|g' {} +
          find src/content/docs -name '*.mdx' -exec sed -i "s|link: '/|link: '/docs-cn/openrig/|g" {} +
          npm ci
          npm run build

      - name: Build openrig-docs-en
        working-directory: openrig-docs-en
        env:
          DOCS_BASE: /docs-cn/openrig-en/
        run: |
          find src/content/docs -name '*.md' -exec sed -i 's|\](/|\](/docs-cn/openrig-en/|g' {} +
          npm ci
          npm run build

      # nimbus 是 pnpm monorepo：先装 workspace，再两段构建（框架包 → www 站点）。
      # 与其他站不同，无需 sed 内链——nimbus 框架的 authored-links 会按 base
      # 自动给正文内链加前缀；DOCS_SITE/DOCS_BASE 由 apps/www/astro.config.ts 读取。
      - name: Build nimbus-docs-cn
        working-directory: nimbus-docs-cn
        env:
          DOCS_SITE: https://lif3ng-vibe.github.io
          DOCS_BASE: /docs-cn/nimbus/
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @cloudflare/nimbus-docs build
          pnpm --filter @nimbus/www build

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          # 入口页由 sites.json 生成（加新站点改 sites.json 即可）
          node scripts/gen-index.cjs
          cp index.html _site/
          # 子站点分别放子目录
          mv codegraph-docs-cn/dist _site/codegraph
          mv orca-docs-cn/dist _site/orca
          mv mattpocock-skills-docs-cn/dist _site/mattpocock-skills
          mv ai-coding-dictionary-docs-cn/dist _site/ai-coding-dictionary
          mv ai-memory-docs-cn/dist _site/ai-memory
          mv ai-memory-docs-en/dist _site/ai-memory-en
          mv openrig-docs-cn/dist _site/openrig
          mv openrig-docs-en/dist _site/openrig-en
          mv nimbus-docs-cn/apps/www/dist _site/nimbus
          # GitHub Pages 需要 .nojekyll 避免下划线开头的 _astro 等目录被忽略
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4