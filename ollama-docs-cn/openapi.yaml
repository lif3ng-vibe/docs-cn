openapi: 3.1.0
info:
  title: Ollama API
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Ollama HTTP API 的 OpenAPI 规范
servers:
  - url: http://localhost:11434
    description: Ollama
security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
  parameters:
    DigestParam:
      name: digest
      in: path
      required: true
      description: 以 `sha256:` 为前缀的 SHA256 摘要标识符
      schema:
        type: string
  schemas:
    ModelOptions:
      type: object
      description: 控制文本生成的运行时选项
      properties:
        # Sampling Options
        seed:
          type: integer
          description: 用于可复现输出的随机种子
        temperature:
          type: number
          format: float
          description: 控制生成的随机性（越高越随机）
        top_k:
          type: integer
          description: 将下一个 token 的选择限制在概率最高的 K 个之内
        top_p:
          type: number
          format: float
          description: 核采样（nucleus sampling）的累积概率阈值
        min_p:
          type: number
          format: float
          description: token 选择的最低概率阈值
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: 将中止生成的停止序列

        # Runtime Options
        num_ctx:
          type: integer
          description: 上下文长度（token 数量）
        num_predict:
          type: integer
          description: 生成 token 的最大数量
      additionalProperties: true
    GenerateRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: 模型名称
        prompt:
          type: string
          description: 供模型生成响应的提示文本
        suffix:
          type: string
          description: 用于 fill-in-the-middle（中间填充）模型：出现在用户提示词之后、模型响应之前的文本
        images:
          type: array
          items:
            type: string
            description: 支持图片输入的模型所用的 Base64 编码图片
        format:
          description: 供模型生成响应的结构化输出格式。支持字符串 `"json"` 或 JSON schema 对象。
          oneOf:
            - type: string
            - type: object
        system:
          description: 供模型生成响应所用的系统提示词
          type: string
        stream:
          description: 为 true 时，以流式返回部分响应
          type: boolean
          default: true
        think:
          $ref: "#/components/schemas/ThinkValue"
        raw:
          type: boolean
          description: 为 true 时，返回模型的原始响应，不套用提示词模板
        keep_alive:
          oneOf:
            - type: string
            - type: number
          description: 模型 keep-alive 时长（例如 `5m`，或 `0` 表示立即卸载）
        options:
          $ref: "#/components/schemas/ModelOptions"
        logprobs:
          type: boolean
          description: 是否返回输出 token 的对数概率
        top_logprobs:
          type: integer
          description: 启用 logprobs 时，每个 token 位置返回的最可能 token 数量
    GenerateResponse:
      type: object
      properties:
        model:
          type: string
          description: 模型名称
        created_at:
          type: string
          description: 响应创建时间的 ISO 8601 时间戳
        response:
          type: string
          description: 模型生成的文本响应
        thinking:
          type: string
          description: 模型生成的思考输出
        done:
          type: boolean
          description: 表示生成是否已完成
        done_reason:
          type: string
          description: 生成停止的原因
        total_duration:
          type: integer
          description: 生成响应所花费的时间（纳秒）
        load_duration:
          type: integer
          description: 加载模型所花费的时间（纳秒）
        prompt_eval_count:
          type: integer
          description: 提示词中的输入 token 数量
        prompt_eval_cached_count:
          type: integer
          description: 从缓存读取的提示词 token 数量
        prompt_eval_duration:
          type: integer
          description: 评估未缓存提示词 token 所花费的时间（纳秒）
        eval_count:
          type: integer
          description: 响应中生成的输出 token 数量
        eval_duration:
          type: integer
          description: 生成 token 所花费的时间（纳秒）
        logprobs:
          type: array
          items:
            $ref: "#/components/schemas/Logprob"
          description: 启用 logprobs 时所生成 token 的对数概率信息
    GenerateStreamEvent:
      type: object
      properties:
        model:
          type: string
          description: 模型名称
        created_at:
          type: string
          description: 响应创建时间的 ISO 8601 时间戳
        response:
          type: string
          description: 该分块中模型生成的文本响应
        thinking:
          type: string
          description: 该分块中模型生成的思考输出
        done:
          type: boolean
          description: 表示流式输出是否已结束
        done_reason:
          type: string
          description: 流式输出结束的原因
        total_duration:
          type: integer
          description: 生成响应所花费的时间（纳秒）
        load_duration:
          type: integer
          description: 加载模型所花费的时间（纳秒）
        prompt_eval_count:
          type: integer
          description: 提示词中的输入 token 数量
        prompt_eval_cached_count:
          type: integer
          description: 从缓存读取的提示词 token 数量
        prompt_eval_duration:
          type: integer
          description: 评估未缓存提示词 token 所花费的时间（纳秒）
        eval_count:
          type: integer
          description: 响应中生成的输出 token 数量
        eval_duration:
          type: integer
          description: 生成 token 所花费的时间（纳秒）
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          description: 消息的发送者。
        content:
          type: string
          description: 消息的文本内容
        images:
          type: array
          items:
            type: string
            description: Base64 编码的图片内容
          description: 多模态模型可选的内联图片列表
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
          description: 模型产生的工具调用请求
    ToolCall:
      type: object
      properties:
        function:
          type: object
          required: [name]
          properties:
            name:
              type: string
              description: 要调用的函数名称
            description:
              type: string
              description: 函数的功能说明
            arguments:
              type: object
              description: 传给函数的参数 JSON 对象
    ToolDefinition:
      type: object
      required: [type, function]
      properties:
        type:
          type: string
          enum: [function]
          description: 工具类型（始终为 `function`）
        function:
          type: object
          required: [name, parameters]
          properties:
            name:
              type: string
              description: 暴露给模型的函数名称
            description:
              type: string
              description: 函数的人类可读描述
            parameters:
              type: object
              description: 函数参数的 JSON Schema
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: 模型名称
        messages:
          type: array
          description: 以消息对象数组表示的聊天历史（每个对象含 role 和 content）
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          description: 模型在聊天过程中可调用的函数工具可选列表
          items:
            $ref: "#/components/schemas/ToolDefinition"
        format:
          oneOf:
            - type: string
              enum: [json]
            - type: object
          description: 响应返回格式。可以是 `json` 或 JSON schema
        options:
          $ref: "#/components/schemas/ModelOptions"
        stream:
          type: boolean
          default: true
        think:
          $ref: "#/components/schemas/ThinkValue"
        keep_alive:
          oneOf:
            - type: string
            - type: number
          description: 模型 keep-alive 时长（例如 `5m`，或 `0` 表示立即卸载）
        logprobs:
          type: boolean
          description: 是否返回输出 token 的对数概率
        top_logprobs:
          type: integer
          description: 启用 logprobs 时，每个 token 位置返回的最可能 token 数量
    ChatResponse:
      type: object
      properties:
        model:
          type: string
          description: 用于生成该消息的模型名称
        created_at:
          type: string
          format: date-time
          description: 响应创建时间戳（ISO 8601）
        message:
          type: object
          properties:
            role:
              type: string
              enum: [assistant]
              description: 模型响应中始终为 `assistant`
            content:
              type: string
              description: 助手消息文本
            thinking:
              type: string
              description: 启用 `think` 时的可选深度思考轨迹
            tool_calls:
              type: array
              items:
                $ref: "#/components/schemas/ToolCall"
              description: 助手请求的工具调用
            images:
              type: array
              items:
                type: string
              description: 响应中可选的 Base64 编码图片
        done:
          type: boolean
          description: 表示聊天响应是否已完成
        done_reason:
          type: string
          description: 响应结束的原因
        total_duration:
          type: integer
          description: 生成所花费的总时间（纳秒）
        load_duration:
          type: integer
          description: 加载模型所花费的时间（纳秒）
        prompt_eval_count:
          type: integer
          description: 提示词中的 token 数量
        prompt_eval_cached_count:
          type: integer
          description: 从缓存读取的提示词 token 数量
        prompt_eval_duration:
          type: integer
          description: 评估未缓存提示词 token 所花费的时间（纳秒）
        eval_count:
          type: integer
          description: 响应中生成的 token 数量
        eval_duration:
          type: integer
          description: 生成 token 所花费的时间（纳秒）
        logprobs:
          type: array
          items:
            $ref: "#/components/schemas/Logprob"
          description: 启用 logprobs 时所生成 token 的对数概率信息
    ChatStreamEvent:
      type: object
      properties:
        model:
          type: string
          description: 该流式事件使用的模型名称
        created_at:
          type: string
          format: date-time
          description: 该分块的创建时间（ISO 8601）
        message:
          type: object
          properties:
            role:
              type: string
              description: 该分块消息的角色
            content:
              type: string
              description: 部分助手消息文本
            thinking:
              type: string
              description: 启用 `think` 时的部分思考文本
            tool_calls:
              type: array
              items:
                $ref: "#/components/schemas/ToolCall"
              description: 部分工具调用（如有）
            images:
              type: array
              items:
                type: string
              description: 部分 Base64 编码图片（如存在）
        done:
          type: boolean
          description: 流中的最后一个事件为 true
    ThinkValue:
      description: 控制模型的思考输出。使用 `/api/show` 可查询所选模型支持的取值及默认值。`true` 表示请求思考，`false` 表示请求不输出思考内容，`null` 使用模型默认值。字符串取值由模型自定义；受支持的名称必须与 `/api/show` 完全一致。不支持数字。
      oneOf:
        - type: boolean
        - type: string
        - type: "null"
    Thinking:
      type: object
      required: [values, default]
      description: 模型宣告的思考控制能力。没有思考元数据的模型会省略该字段。
      properties:
        values:
          type: array
          description: 模型 `think` 请求字段明确支持的取值。布尔值表示开/关控制，字符串表示模型自定义档位。仅包含 `false` 的数组表示该模型不支持思考。
          items:
            oneOf:
              - type: boolean
              - type: string
        default:
          description: 未设置 `think` 时使用的取值。对于使用该元数据定义命名思考档位的模型，不受支持的名称会回退到该默认值。
          oneOf:
            - type: boolean
            - type: string
    StatusEvent:
      type: object
      properties:
        status:
          type: string
          description: 人类可读的状态消息
        digest:
          type: string
          description: 与该状态关联的内容摘要（如适用）
        total:
          type: integer
          description: 该操作预期的总字节数
        completed:
          type: integer
          description: 目前已传输的字节数
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          description: 当前状态消息
    EmbedRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
          description: 模型名称
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: 要生成嵌入的文本或文本数组
        truncate:
          type: boolean
          default: true
          description: 为 true 时，截断超出上下文窗口的输入；为 false 时，返回错误。
        dimensions:
          type: integer
          description: 要生成的嵌入维度数量
        keep_alive:
          type: string
          description: 模型 keep-alive 时长
        options:
          $ref: "#/components/schemas/ModelOptions"
    EmbedResponse:
      type: object
      properties:
        model:
          type: string
          description: 生成这些嵌入的模型
        embeddings:
          type: array
          items:
            type: array
            items:
              type: number
          description: 向量嵌入数组
        total_duration:
          type: integer
          description: 生成所花费的总时间（纳秒）
        load_duration:
          type: integer
          description: 加载时间（纳秒）
        prompt_eval_count:
          type: integer
          description: 为生成嵌入而处理的输入 token 数量
    CreateRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: 要创建的模型名称
        from:
          type: string
          description: 用于创建的现有模型
        template:
          type: string
          description: 模型使用的提示词模板
        renderer:
          type: string
          description: 模型渲染器（renderer）的名称
        parser:
          type: string
          description: 模型解析器（parser）的名称
        files:
          type: object
          additionalProperties:
            type: string
          description: 源文件名到其 SHA-256 摘要的映射。分片 GGUF 模型必须以原始分片文件名包含每个分片。
        draft_files:
          type: object
          additionalProperties:
            type: string
          description: 草稿（draft）源文件名到其 SHA-256 摘要的映射
        license:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: 模型的许可证字符串或许可证列表
        system:
          type: string
          description: 要嵌入模型的系统提示词
        parameters:
          type: object
          description: 模型的键值参数
        messages:
          description: 模型使用的消息历史
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        quantize:
          type: string
          description: 导入时应用的量化级别（例如 `nvfp4`）
        draft_quantize:
          type: string
          description: 导入时应用到草稿权重的量化级别
        requires:
          type: string
          description: 模型要求的最低 Ollama 版本
        capabilities:
          type: array
          items:
            type: string
          description: 要添加的能力，不会移除继承或推断出的能力（例如兼容的决策模型可用 `decision`）
        stream:
          type: boolean
          default: true
          description: 以流式返回状态更新
    CopyRequest:
      type: object
      required: [source, destination]
      properties:
        source:
          type: string
          description: 要复制的现有模型名称
        destination:
          type: string
          description: 要创建的新模型名称
    DeleteRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: 要删除的模型名称
    PullRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: 要下载的模型名称
        insecure:
          type: boolean
          description: 允许通过不安全的连接下载
        stream:
          type: boolean
          default: true
          description: 以流式返回进度更新
    PushRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: 要发布的模型名称
        insecure:
          type: boolean
          description: 允许通过不安全的连接发布
        stream:
          type: boolean
          default: true
          description: 以流式返回进度更新
    ShowRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: 要查看的模型名称
        verbose:
          type: boolean
          description: 为 true 时，响应中包含较大的详细字段。
    ShowResponse:
      type: object
      properties:
        thinking:
          $ref: "#/components/schemas/Thinking"
        parameters:
          type: string
          description: 序列化为文本的模型参数设置
        license:
          type: string
          description: 模型的许可证
        modified_at:
          type: string
          description: 最后修改时间戳（ISO 8601 格式）
        details:
          type: object
          description: 模型概要信息
        template:
          type: string
          description: 模型渲染提示词所用的模板
        renderer:
          type: string
          description: 模型实际生效的聊天渲染器（别名已解析），如已设置
        parser:
          type: string
          description: 模型上配置的输出解析器，如已设置
        template_source:
          type: string
          description: 聊天提示词的实际来源；为 `renderer_parser`、`renderer`、`parser`（运行 Go 渲染器，打包的模板不生效）、`harmony`、`go_template`、`gguf_chat_template`（运行器渲染 GGUF 内嵌的 jinja）或 `none` 之一
        capabilities:
          type: array
          items:
            type: string
          description: 支持的特性列表
        model_info:
          type: object
          description: 额外的模型元数据
    ModelSummary:
      type: object
      description: 本地可用模型的概要信息
      properties:
        name:
          type: string
          description: 模型名称
        model:
          type: string
          description: 模型名称
        remote_model:
          type: string
          description: 上游模型的名称（若模型为远程模型）
        remote_host:
          type: string
          description: 上游 Ollama 主机的 URL（若模型为远程模型）
        modified_at:
          type: string
          description: 最后修改时间戳（ISO 8601 格式）
        size:
          type: integer
          description: 模型在磁盘上的总大小（字节）
        digest:
          type: string
          description: 模型内容的 SHA256 摘要标识符
        details:
          type: object
          description: 关于模型格式与家族的额外信息
          properties:
            format:
              type: string
              description: 模型文件格式（例如 `gguf`）
            family:
              type: string
              description: 主要模型家族（例如 `llama`）
            families:
              type: array
              items:
                type: string
              description: 模型所属的全部家族（如适用）
            parameter_size:
              type: string
              description: 近似参数量标签（例如 `7B`、`13B`）
            quantization_level:
              type: string
              description: 所用的量化级别（例如 `Q4_0`）
    ListResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummary"
    Ps:
      type: object
      properties:
        name:
          type: string
          description: 正在运行的模型名称
        model:
          type: string
          description: 正在运行的模型名称
        size:
          type: integer
          description: 模型大小（字节）
        digest:
          type: string
          description: 模型的 SHA256 摘要
        details:
          type: object
          description: 模型详情（如格式与家族）
        expires_at:
          type: string
          description: 模型将被卸载的时间
        size_vram:
          type: integer
          description: 显存占用（字节）
        context_length:
          type: integer
          description: 正在运行模型的上下文长度
    PsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/Ps"
          description: 当前正在运行的模型
    WebSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: 搜索查询字符串
        max_results:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: 返回结果的最大数量
    WebSearchResult:
      type: object
      properties:
        title:
          type: string
          description: 结果的页面标题
        url:
          type: string
          format: uri
          description: 结果解析后的 URL
        content:
          type: string
          description: 提取的文本内容片段
    WebSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/WebSearchResult"
          description: 匹配的搜索结果数组
    WebFetchRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: 要抓取的 URL
    WebFetchResponse:
      type: object
      properties:
        title:
          type: string
          description: 所抓取页面的标题
        content:
          type: string
          description: 提取的页面内容
        links:
          type: array
          items:
            type: string
            format: uri
          description: 页面上找到的链接
    VersionResponse:
      type: object
      properties:
        version:
          type: string
          description: Ollama 的版本
    TokenLogprob:
      type: object
      description: 单个候选 token 的对数概率信息
      properties:
        token:
          type: string
          description: token 的文本表示
        logprob:
          type: number
          description: 该 token 的对数概率
        bytes:
          type: array
          items:
            type: integer
          description: token 的原始字节表示
    Logprob:
      type: object
      description: 所生成 token 的对数概率信息
      properties:
        token:
          type: string
          description: token 的文本表示
        logprob:
          type: number
          description: 该 token 的对数概率
        bytes:
          type: array
          items:
            type: integer
          description: token 的原始字节表示
        top_logprobs:
          type: array
          items:
            $ref: "#/components/schemas/TokenLogprob"
          description: 该位置最可能的 token 及其对数概率
    SystemOneContent:
      description: 非空字符串，或序列化为 JSON 文本的对象或数组。不会被解析为聊天消息或多模态输入。
      oneOf:
        - type: string
          pattern: '\S'
        - type: object
          additionalProperties: true
        - type: array
          items: {}
    SystemOneChoiceQuestion:
      title: Choice
      type: object
      required: [type, instructions, criteria]
      properties:
        type:
          type: string
          enum: [choice]
        instructions:
          $ref: "#/components/schemas/SystemOneContent"
        criteria:
          type: object
          description: 选项键到描述的映射，裸标签则为 null。键不能为空；平局时按模型的选项顺序处理。选项数量上限取决于模型。
          minProperties: 2
          maxProperties: 255
          propertyNames:
            pattern: '\S'
          additionalProperties:
            type: [string, "null"]
    SystemOneNoulQuestion:
      title: Noul
      type: object
      required: [type, instructions]
      properties:
        type:
          type: string
          enum: [noul]
        instructions:
          $ref: "#/components/schemas/SystemOneContent"
        criteria:
          type: object
          description: 两种结果各自的可选描述。省略的条目使用模型特定的默认值。
          properties:
            "false":
              type: string
            "true":
              type: string
          additionalProperties: false
    SystemOneScoreQuestion:
      title: Score
      type: object
      required: [type, instructions, criteria]
      properties:
        type:
          type: string
          enum: [score]
        instructions:
          $ref: "#/components/schemas/SystemOneContent"
        criteria:
          type: array
          description: 按最低分（索引 0）到最高分排列的描述。定义从 0 到标准数减 1 的量表。
          minItems: 2
          maxItems: 10
          items:
            type: string
    SystemOneRequest:
      type: object
      required: [model, state, questions]
      properties:
        model:
          type: string
          pattern: '\S'
          description: 为 System One 训练的模型，例如 nimble；Ollama 云端则为 clef:cloud。
        state:
          $ref: "#/components/schemas/SystemOneContent"
        images:
          type: array
          description: 所有问题共享的 Base64 编码图片，按请求顺序排列。需要具备视觉能力的模型（如 Clef）。支持音频输入的模型还可在此接受 WAV 片段。不支持 URL 和 data URL。
          items:
            type: string
            format: byte
        questions:
          type: object
          description: 关于共享状态的命名问题。答案不会传给后续问题。云端模型接受的名称最长 100 个 ASCII 字母、数字、`_`、`.` 或 `-`。
          minProperties: 1
          maxProperties: 64
          propertyNames:
            pattern: '\S'
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/SystemOneChoiceQuestion"
              - $ref: "#/components/schemas/SystemOneNoulQuestion"
              - $ref: "#/components/schemas/SystemOneScoreQuestion"
        keep_alive:
          oneOf:
            - type: string
            - type: number
          description: 请求完成后模型保持加载的时长，可用时长字符串（如 5m）或秒数表示。0 表示请求后卸载；负值表示保持加载。默认为服务器的 keep-alive 设置（未配置时为 5m）。
    SystemOneProbabilities:
      type: object
      description: 在给定候选上归一化的概率，受浮点精度影响总和为 1。
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
    SystemOneConfidence:
      type: number
      minimum: 0
      maximum: 1
      description: 分布集中度，按 1 - H(p) / ln(N) 计算，其中 H(p) 为熵，N 为候选数量。0 表示概率均匀；接近 1 表示某个候选占主导。并非经过校准的正确性。
    SystemOneChoiceAnswer:
      title: Choice
      type: object
      required: [type, choice, probabilities, confidence]
      properties:
        type:
          type: string
          enum: [choice]
        choice:
          type: string
          description: 概率最高的选项键。平局时按模型的选项顺序处理。
        probabilities:
          $ref: "#/components/schemas/SystemOneProbabilities"
        confidence:
          $ref: "#/components/schemas/SystemOneConfidence"
    SystemOneNoulAnswer:
      title: Noul
      type: object
      required: [type, noul]
      properties:
        type:
          type: string
          enum: [noul]
        noul:
          type: number
          minimum: 0
          maximum: 1
          description: 在假与真候选中为真的概率。这是一个数字，不是布尔值。
    SystemOneScoreAnswer:
      title: Score
      type: object
      required: [type, score, legend, probabilities, confidence]
      properties:
        type:
          type: string
          enum: [score]
        score:
          type: number
          minimum: 0
          maximum: 9
          description: 各标准（从 0 起计数）索引的概率加权平均值，范围从 0 到标准数减 1。不会四舍五入到某个档位，也不会归一化到 0–1。
        legend:
          type: object
          description: 以字符串键表示的从 0 起的索引，映射到各标准描述。
          additionalProperties:
            type: string
        probabilities:
          $ref: "#/components/schemas/SystemOneProbabilities"
          description: 以字符串形式的从 0 起标准索引为键的概率。
        confidence:
          $ref: "#/components/schemas/SystemOneConfidence"
    SystemOneResponse:
      type: object
      required: [model, answers, usage]
      properties:
        model:
          type: string
          description: 请求中的模型名称。
        answers:
          type: object
          description: 以请求中的问题名称为键的回答。
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/SystemOneChoiceAnswer"
              - $ref: "#/components/schemas/SystemOneNoulAnswer"
              - $ref: "#/components/schemas/SystemOneScoreAnswer"
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens:
              type: integer
              minimum: 0
              description: 评估的输入 token 总数，包括图片位置。当模型分别为各问题打分时，共享上下文会被重复计算。
            output_tokens:
              type: integer
              minimum: 0
              description: 打分过程中内部生成的 token 数，包括前缀准备与重试。可能超过问题数量；并非 JSON 响应的长度。
    UsageMetrics:
      type: object
      required: [request_count]
      properties:
        request_count:
          type: integer
          minimum: 0
          description: 记录的请求数。
        usage_usd:
          type: number
          description: 请求的总金额（美元），包括套餐覆盖的用量与用已购额度支付的用量。
        input_tokens:
          type: integer
          description: 记录的输入 token 数，包括缓存的输入 token。
        cached_input_tokens:
          type: integer
          description: 从缓存读取的输入 token 数，已计入 input_tokens。
        output_tokens:
          type: integer
          description: 记录的输出 token 数。
    UsageGroup:
      allOf:
        - $ref: "#/components/schemas/UsageMetrics"
        - type: object
          required: [model]
          properties:
            model:
              type: string
              description: 模型名称。
    UsageSummary:
      allOf:
        - $ref: "#/components/schemas/UsageMetrics"
        - type: object
          properties:
            groups:
              type: array
              description: 请求 group_by 时出现。目前返回最多 10 个从整个范围中选出的分组，按 usage_usd 排序；若范围包含旧版请求，则按 request_count 排序。各时间桶中的分组顺序相同；某时间桶内没有请求的分组会被省略。
              items:
                $ref: "#/components/schemas/UsageGroup"
            remainder:
              $ref: "#/components/schemas/UsageMetrics"
              description: 超出当前数量上限的分组的合并用量。没有其他分组的请求时省略。
    UsageBucket:
      allOf:
        - $ref: "#/components/schemas/UsageSummary"
        - type: object
          required: [from, until]
          properties:
            from:
              type: string
              format: date-time
              description: 时间桶起始时间（UTC），包含边界。
            until:
              type: string
              format: date-time
              description: 时间桶结束时间（UTC），不包含边界。
            partial:
              type: boolean
              description: 当前小时或当天（仍在进行中）存在且为 true。
    UsageResponse:
      type: object
      required: [range, scope, granularity, from, until, totals, buckets]
      properties:
        range:
          type: string
          enum: [24h, 7d, 30d]
          description: 所选时间范围。
        scope:
          type: string
          enum: [self, team]
          description: 所选用量范围（scope）。
        granularity:
          type: string
          enum: [hour, day]
          description: "自动设置：hour 对应 24h，day 对应 7d 和 30d。"
        group_by:
          type: string
          enum: [model]
          description: 所选分组方式。请求 group_by 时出现。
        from:
          type: string
          format: date-time
          description: 范围起始时间（UTC），包含边界。
        until:
          type: string
          format: date-time
          description: 范围结束时间（UTC），不包含边界。
        totals:
          $ref: "#/components/schemas/UsageSummary"
          description: 整个范围的用量，包括 remainder 中的分组。
        buckets:
          type: array
          description: 按时间先后排列的用量，包括没有请求记录的时间桶。
          items:
            $ref: "#/components/schemas/UsageBucket"
    IncludedBalance:
      title: Included credits
      type: object
      required: [balance_usd, allowance_usd, period]
      properties:
        balance_usd:
          type: number
          description: 剩余内含额度（美元）。
        allowance_usd:
          type: number
          description: 整个周期可用的内含额度（美元）。
        period:
          type: object
          required: [from, until]
          properties:
            from:
              type: string
              format: date-time
              description: 内含额度周期的起始时间（UTC），包含边界。
            until:
              type: string
              format: date-time
              description: 内含额度周期的结束时间（UTC），不包含边界。
    LegacyBalanceLimit:
      type: object
      required: [remaining_percent, resets_at]
      properties:
        remaining_percent:
          type: number
          minimum: 0
          maximum: 100
          description: 限额剩余百分比。
        resets_at:
          type: string
          format: date-time
          description: 下次重置时间（UTC）。
    LegacyIncludedBalance:
      title: Legacy plan limits
      type: object
      required: [session, weekly]
      properties:
        session:
          $ref: "#/components/schemas/LegacyBalanceLimit"
        weekly:
          $ref: "#/components/schemas/LegacyBalanceLimit"
    BalanceResponse:
      type: object
      required: [included, purchased]
      properties:
        included:
          oneOf:
            - $ref: "#/components/schemas/IncludedBalance"
            - $ref: "#/components/schemas/LegacyIncludedBalance"
        purchased:
          type: object
          required: [balance_usd]
          properties:
            balance_usd:
              type: number
              description: 剩余未过期的已购额度（美元）。
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 描述错误原因的错误消息
paths:
  /v1/systemone:
    post:
      summary: 回答结构化问题
      description: |
        使用 System One 模型在本地或 Ollama 云端回答选择、是/否与打分问题。需要 Ollama v0.35.0 或更高版本，云端模型需要 v0.40.5 或更高版本。示例请参阅[决策指南](/capabilities/decision)。
      operationId: systemone
      servers:
        - url: http://localhost:11434
          description: Ollama
        - url: https://ollama.com
          description: Ollama 云端
      security:
        - {}
        - bearerAuth: []
      x-mint:
        href: /api/systemone
        metadata:
          title: System One
          sidebarTitle: /v1/systemone
        content: |
          - 仅返回一个 JSON 响应；不支持流式输出、视频、工具与生成控制。
          - 本地请求的文本与 schema（不含图片）必须不超过 64 KiB，整个请求（含 base64 与 JSON）不超过 32 MiB。完整输入必须能装进已加载的上下文窗口。Nimble 与 Tev 还需要两个 token 位置用于打分。输入不会被截断。
          - 云端模型需要付费套餐或已购[用量额度](https://ollama.com/pricing)。云端请求最多接受 64 个问题，名称最长 100 个 ASCII 字母、数字、`_`、`.` 或 `-`；最多 4 张图片，每张不超过 4 MiB 和 16 百万像素，总计不超过 8 MiB。请求必须不超过 13 MiB，且输入必须装进模型 65,536 token 的上下文窗口。
      x-codeSamples:
        - lang: bash
          label: Choose a label
          source: |
            curl http://localhost:11434/v1/systemone \
              -H 'Content-Type: application/json' \
              -d '{
                "model": "nimble",
                "state": "Our checkout has returned 500 errors since 9am.",
                "questions": {
                  "label": {
                    "type": "choice",
                    "instructions": "Which label fits this ticket?",
                    "criteria": {
                      "billing": "Payments and refunds",
                      "bug": "Software errors",
                      "account": "Login and account access"
                    }
                  }
                }
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemOneRequest"
            example:
              model: nimble
              state: Our checkout has returned 500 errors since 9am.
              questions:
                label:
                  type: choice
                  instructions: Which label fits this ticket?
                  criteria:
                    billing: Payments and refunds
                    bug: Software errors
                    account: Login and account access
      responses:
        "200":
          description: 所有问题的回答与 token 用量。示例中的概率与置信度四舍五入到四位小数；结果与用量会随模型和服务器配置而变化。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOneResponse"
              example:
                model: nimble
                answers:
                  label:
                    type: choice
                    choice: bug
                    probabilities:
                      billing: 0.0125
                      bug: 0.9781
                      account: 0.0093
                    confidence: 0.8906
                usage:
                  input_tokens: 174
                  output_tokens: 1
        "400":
          description: 请求无效、模型或运行器不受支持，或渲染后的提示词超出已加载上下文或云端模型的 token 上限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 请求云端模型时未登录，或 API 密钥无效。通过本地服务器请求时，响应会包含 `signin_url`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: 免费套餐不包含该云端模型。请添加用量额度或升级套餐。支付失败时也返回此状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 未找到模型。发起请求前请先下载本地模型。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: 本地请求的文本与 schema 超过 64 KiB，或请求超过 32 MiB；或云端请求超过 13 MiB 或模型的上下文窗口。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: text and schema must not exceed 64 KiB
        "500":
          description: 模型加载、渲染或打分失败。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/generate:
    post:
      summary: 生成响应
      description: 根据提供的提示词生成响应
      operationId: generate
      x-mint:
        metadata:
          sidebarTitle: /api/generate
        href: /api/generate
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma4",
              "prompt": "Why is the sky blue?"
            }'
        - lang: bash
          label: Non-streaming
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma4",
              "prompt": "Why is the sky blue?",
              "stream": false
            }'
        - lang: bash
          label: Thinking
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gpt-oss",
              "prompt": "What is 1+1?",
              "think": "low",
              "stream": false
            }'
        - lang: bash
          label: With options
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma4",
              "prompt": "Why is the sky blue?",
              "options": {
                "temperature": 0.8,
                "top_p": 0.9,
                "seed": 42
              }
            }'
        - lang: bash
          label: Structured outputs
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma4",
              "prompt": "What are the populations of the United States and Canada?",
              "stream": false,
              "format": {
                "type": "object",
                "properties": {
                  "countries": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "country": {"type": "string"},
                        "population": {"type": "integer"}
                      },
                      "required": ["country", "population"]
                    }
                  }
                },
                "required": ["countries"]
              }
            }'
        - lang: bash
          label: With images
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma4",
              "prompt": "What is in this picture?",
              "images": [""]
            }'
        - lang: bash
          label: Load model
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma4"
            }'
        - lang: bash
          label: Unload model
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma4",
              "keep_alive": 0
            }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
            example:
              model: gemma4
              prompt: Why is the sky blue?
      responses:
        "200":
          description: 生成响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
              example:
                model: "gemma4"
                created_at: "2025-10-17T23:14:07.414671Z"
                response: "Hello! How can I help you today?"
                done: true
                done_reason: "stop"
                total_duration: 174560334
                load_duration: 101397084
                prompt_eval_count: 11
                prompt_eval_duration: 13074791
                eval_count: 18
                eval_duration: 52479709
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/GenerateStreamEvent"
  /api/chat:
    post:
      summary: 生成聊天消息
      description: 在用户与助手的对话中生成下一条聊天消息。
      operationId: chat
      x-mint:
        metadata:
          sidebarTitle: /api/chat
        href: /api/chat
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/chat -d '{
              "model": "gemma4",
              "messages": [
                {
                  "role": "user",
                  "content": "why is the sky blue?"
                }
              ]
            }'
        - lang: bash
          label: Non-streaming
          source: |
            curl http://localhost:11434/api/chat -d '{
              "model": "gemma4",
              "messages": [
                {
                  "role": "user",
                  "content": "why is the sky blue?"
                }
              ],
              "stream": false
            }'
        - lang: bash
          label: Structured outputs
          source: |
            curl -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d '{
              "model": "gemma4",
              "messages": [
                {
                  "role": "user",
                  "content": "What are the populations of the United States and Canada?"
                }
              ],
              "stream": false,
              "format": {
                "type": "object",
                "properties": {
                  "countries": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "country": {"type": "string"},
                        "population": {"type": "integer"}
                      },
                      "required": ["country", "population"]
                    }
                  }
                },
                "required": ["countries"]
              }
            }'
        - lang: bash
          label: Tool calling
          source: |
            curl http://localhost:11434/api/chat -d '{
              "model": "qwen3",
              "messages": [
                {
                  "role": "user",
                  "content": "What is the weather today in Paris?"
                }
              ],
              "stream": false,
              "tools": [
                {
                  "type": "function",
                  "function": {
                    "name": "get_current_weather",
                    "description": "Get the current weather for a location",
                    "parameters": {
                      "type": "object",
                      "properties": {
                        "location": {
                          "type": "string",
                          "description": "The location to get the weather for, e.g. San Francisco, CA"
                        },
                        "format": {
                          "type": "string",
                          "description": "The format to return the weather in, e.g. 'celsius' or 'fahrenheit'",
                          "enum": ["celsius", "fahrenheit"]
                        }
                      },
                      "required": ["location", "format"]
                    }
                  }
                }
              ]
            }'
        - lang: bash
          label: Thinking
          source: |
            curl http://localhost:11434/api/chat -d '{
