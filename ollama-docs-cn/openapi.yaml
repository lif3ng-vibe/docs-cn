  /api/usage:
    get:
      summary: 云端用量
      description: 云端推理、网页搜索与网页抓取的用量统计。
      operationId: usage
      servers:
        - url: https://ollama.com
          description: Ollama 云端
      security:
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          description: 要包含的已完成 UTC 小时或天，加上当前未完成的小时或天。
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
        - name: scope
          in: query
          description: 你的请求或你团队的请求。团队范围需要团队管理员权限。
          schema:
            type: string
            enum: [self, team]
            default: self
        - name: group_by
          in: query
          description: "如何对 totals 与时间桶内的用量分组。支持取值：model。"
          schema:
            type: string
            enum: [model]
      responses:
        "200":
          description: 所选范围与 scope 的用量。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          description: 查询参数无效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 凭据无效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 账号被停用，或请求团队范围但不具备团队管理员权限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 请求过多。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          headers:
            Retry-After:
              description: 重试前需等待的秒数。
              schema:
                type: integer
                minimum: 1
        "503":
          description: 用量报告暂时不可用。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
