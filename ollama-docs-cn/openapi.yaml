      parameters:
        - $ref: "#/components/parameters/DigestParam"
      responses:
        "200":
          description: blob 存在
        "400":
          description: 摘要无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 未找到 blob
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 检查 blob 失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
