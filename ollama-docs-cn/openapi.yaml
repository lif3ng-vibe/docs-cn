      summary: 推送 blob
      operationId: createBlob
      parameters:
        - $ref: "#/components/parameters/DigestParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: blob 已存在
        "201":
          description: blob 已创建
        "400":
          description: 摘要或 blob 内容无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 写入 blob 失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
