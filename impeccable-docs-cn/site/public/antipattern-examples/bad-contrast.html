<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反模式：糟糕的对比度选择</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #1e1e1e;
      padding: 40px;
    }

    .container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      background: linear-gradient(180deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 24px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Header with gray text on colored bg - BAD */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 48px;
      font-weight: 800;
      color: #808080; /* Gray on blue/purple - very hard to read */
      margin-bottom: 12px;
    }

    .header p {
      font-size: 18px;
      color: #666666; /* Even worse gray */
    }

    /* Colored cards with gray bg labels - THE PROBLEM */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .card {
      border-radius: 16px;
      padding: 24px;
      color: white;
    }

    .card.blue { background: #2563eb; }
    .card.green { background: #16a34a; }
    .card.orange { background: #ea580c; }

    /* Gray background labels on colored cards - looks terrible */
    .card-label {
      display: inline-block;
      background: #9ca3af; /* Gray bg on colored card */
      color: #4b5563; /* Gray text on gray bg */
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .card-icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff; /* Pure white - harsh */
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      color: #555555; /* Dark gray on colored bg - hard to read */
      line-height: 1.5;
    }

    /* Stats section with absolute black bg */
    .stats {
      background: #000000; /* Absolute black */
      border-radius: 16px;
      padding: 32px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 32px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      color: #ffffff; /* Pure white */
    }

    .stat-label {
      font-size: 14px;
      color: #444444; /* Dark gray on black - nearly invisible */
    }

    /* Footer area */
    .footer {
      background: #f0f0f0; /* Light gray bg */
      border-radius: 16px;
      padding: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-text {
      color: #a0a0a0; /* Gray text on gray bg - no contrast */
      font-size: 14px;
    }

    .footer-btn {
      background: #ffffff; /* Pure white btn */
      color: #000000; /* Pure black text */
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      border: none;
    }


  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>欢迎使用我们的平台</h1>
      <p>面向现代团队与企业的最佳解决方案</p>
    </div>

    <div class="cards">
      <div class="card blue">
        <span class="card-label">热门</span>
        <div class="card-icon">⚡</div>
        <h3>性能飞快</h3>
        <p>为速度而生：代码经过优化，算法高效。</p>
      </div>
      <div class="card green">
        <span class="card-label">新品</span>
        <div class="card-icon">🔒</div>
        <h3>安全无忧</h3>
        <p>企业级安全，数据加密存储。</p>
      </div>
      <div class="card orange">
        <span class="card-label">精选</span>
        <div class="card-icon">📊</div>
        <h3>数据分析</h3>
        <p>强大的洞察力，助你做出更明智的决策。</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value">10K+</div>
        <div class="stat-label">活跃用户</div>
      </div>
      <div class="stat">
        <div class="stat-value">99.9%</div>
        <div class="stat-label">可用性保障</div>
      </div>
      <div class="stat">
        <div class="stat-value">50M+</div>
        <div class="stat-label">已处理数据</div>
      </div>
    </div>

    <div class="footer">
      <span class="footer-text">准备好开始了吗？立即注册，加入数千名满意用户的行列。</span>
      <button class="footer-btn">立即开始</button>
    </div>

  </div>
<script src="/docs-cn/impeccable/js/detect-antipatterns-browser.js""></script>
</body>
</html>
