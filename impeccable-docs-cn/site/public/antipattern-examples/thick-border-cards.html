<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反模式：侧边彩条卡片</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #f1f5f9;
      padding: 40px;
    }

    .container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .header p {
      font-size: 16px;
      color: #64748b;
    }

    /* Cards grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      flex: 1;
    }

    /* THE PROBLEM: Left border accent on rounded cards */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      /* The weird left border that doesn't match the rounded corners */
      border-left: 4px solid;
    }

    .card-blue { border-left-color: #3b82f6; }
    .card-purple { border-left-color: #a855f7; }
    .card-green { border-left-color: #22c55e; }
    .card-orange { border-left-color: #f97316; }

    .card-icon {
      font-size: 28px;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
      flex: 1;
    }

    .card-btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      width: fit-content;
      background: #f1f5f9;
      color: #475569;
    }

    /* Stats bar - also with left border accent */
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-top: 24px;
    }

    .stat-item {
      flex: 1;
      padding: 20px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 4px solid;
    }

    .stat-item:nth-child(1) { border-left-color: #06b6d4; }
    .stat-item:nth-child(2) { border-left-color: #ec4899; }
    .stat-item:nth-child(3) { border-left-color: #eab308; }
    .stat-item:nth-child(4) { border-left-color: #6366f1; }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }


  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>我们的服务</h1>
      <p>探索我们能为你的业务做些什么</p>
    </div>

    <div class="cards">
      <div class="card card-blue">
        <div class="card-icon">🚀</div>
        <h3>增长战略</h3>
        <p>用经过验证的策略与专家指导，加速你的业务增长。</p>
        <button class="card-btn">了解更多</button>
      </div>

      <div class="card card-purple">
        <div class="card-icon">💡</div>
        <h3>创新实验室</h3>
        <p>用前沿的创新服务，把想法变成现实。</p>
        <button class="card-btn">探索</button>
      </div>

      <div class="card card-green">
        <div class="card-icon">📊</div>
        <h3>数据分析</h3>
        <p>用全面的分析方案，做出数据驱动的决策。</p>
        <button class="card-btn">开始使用</button>
      </div>

      <div class="card card-orange">
        <div class="card-icon">🎯</div>
        <h3>市场营销</h3>
        <p>凭借我们的营销专长，高效触达你的目标受众。</p>
        <button class="card-btn">联系我们</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value">500+</div>
        <div class="stat-label">客户数</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">98%</div>
        <div class="stat-label">满意度</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">24/7</div>
        <div class="stat-label">支持</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">50+</div>
        <div class="stat-label">国家/地区</div>
      </div>
    </div>

  </div>
<script src="/docs-cn/impeccable/js/detect-antipatterns-browser.js""></script>
</body>
</html>
