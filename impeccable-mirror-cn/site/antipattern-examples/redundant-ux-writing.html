<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反模式：冗余的 UX 文案</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #f0f4f8;
      padding: 40px;
    }

    .container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    /* Page Header */
    .page-header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e5e7eb;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .page-header p {
      font-size: 14px;
      color: #6b7280;
    }

    /* Section with DUPLICATE heading */
    .section {
      background: #f9fafb;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .section-header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .section-header h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .section-header p {
      font-size: 13px;
      color: #6b7280;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-sublabel {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
      display: block;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Button section */
    .button-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .btn-helper {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      line-height: 1.5;
    }

    /* Form row */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }


  </style>
</head>
<body>
  <div class="container">
    <!-- PAGE HEADER -->
    <div class="page-header">
      <h1>创建你的账户</h1>
      <p>注册以开始使用我们的平台</p>
    </div>

    <!-- SECTION WITH DUPLICATE HEADING -->
    <div class="section">
      <div class="section-header">
        <h2>创建你的账户</h2>
        <p>填写下方表单，创建你的新账户</p>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">名字</label>
          <span class="form-sublabel">输入你的名字</span>
          <input type="text" class="form-input" placeholder="输入名字">
          <span class="form-hint">即你的证件上显示的名字</span>
        </div>
        <div class="form-group">
          <label class="form-label">姓氏</label>
          <span class="form-sublabel">输入你的姓氏</span>
          <input type="text" class="form-input" placeholder="输入姓氏">
          <span class="form-hint">即你的证件上显示的姓氏</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">电子邮箱</label>
        <span class="form-sublabel">提供一个有效的电子邮箱地址</span>
        <input type="email" class="form-input" placeholder="example@email.com">
        <span class="form-hint">你的电子邮箱将用于通过电子邮件向你发送重要通知</span>
      </div>

      <div class="form-group">
        <label class="form-label">创建密码</label>
        <span class="form-sublabel">选择一个安全的密码</span>
        <input type="password" class="form-input" placeholder="输入密码">
        <span class="form-hint">为了安全起见，密码必须至少 8 个字符</span>
      </div>

      <div class="button-section">
        <button class="btn-submit">创建账户</button>
        <p class="btn-helper">点击上方按钮，创建你的账户并完成注册</p>
      </div>
    </div>

  </div>
<script src="/docs-cn/impeccable-mirror/js/detect-antipatterns-browser.js"></script>

</html>
