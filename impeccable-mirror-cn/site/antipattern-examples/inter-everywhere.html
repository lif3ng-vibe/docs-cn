<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反模式：Inter 铺天盖地</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: #f5f5f5;
      padding: 40px;
    }

    .container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .nav-links a {
      color: #666;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-cta {
      background: #111;
      color: #fff !important;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
    }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 700px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f0f0f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      width: fit-content;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 20px;
      color: #111;
      letter-spacing: -2px;
    }

    .subtitle {
      font-size: 18px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .cta-group {
      display: flex;
      gap: 12px;
    }

    .btn-primary {
      background: #111;
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }

    .btn-secondary {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      color: #333;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    /* Features */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 48px;
      padding-top: 40px;
      border-top: 1px solid #eee;
    }

    .feature {
      padding: 20px;
    }

    .feature-icon {
      width: 40px;
      height: 40px;
      background: #f5f5f5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 18px;
    }

    .feature h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111;
      letter-spacing: -0.3px;
    }

    .feature p {
      font-size: 13px;
      color: #888;
      line-height: 1.5;
      font-weight: 400;
    }

    /* Testimonial */
    .testimonial {
      background: #fafafa;
      border-radius: 12px;
      padding: 24px;
      margin-top: 24px;
    }

    .testimonial-text {
      font-size: 14px;
      color: #444;
      line-height: 1.6;
      font-style: italic;
      margin-bottom: 16px;
    }

    .testimonial-author {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .testimonial-avatar {
      width: 36px;
      height: 36px;
      background: #ddd;
      border-radius: 50%;
    }

    .testimonial-name {
      font-size: 13px;
      font-weight: 600;
      color: #111;
    }

    .testimonial-role {
      font-size: 12px;
      color: #888;
      font-weight: 400;
    }

    /* Font specimen overlay */
    .font-specimen {
      position: absolute;
      top: 48px;
      right: 48px;
      background: #111;
      color: #fff;
      padding: 16px 24px;
      border-radius: 10px;
      text-align: center;
    }

    .font-specimen-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 4px;
    }

    .font-specimen-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .font-specimen-weights {
      font-size: 9px;
      color: #666;
      margin-top: 6px;
    }


  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div class="logo">泛泛科技</div>
      <div class="nav-links">
        <a href="#">产品</a>
        <a href="#">功能</a>
        <a href="#">定价</a>
        <a href="#" class="nav-cta">注册</a>
      </div>
    </nav>

    <div class="font-specimen">
      <div class="font-specimen-label">所用字体</div>
      <div class="font-specimen-name">Inter</div>
      <div class="font-specimen-weights">400 · 500 · 600 · 700 · 800</div>
    </div>

    <div class="hero">
      <span class="badge">现已上线</span>
      <h1>面向现代团队的平台</h1>
      <p class="subtitle">用我们的一站式方案理顺你的工作流。为追求快速行动、更快上线的团队而打造。</p>
      <div class="cta-group">
        <button class="btn-primary">免费开始</button>
        <button class="btn-secondary">预约演示</button>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">⚡</div>
        <h3>快如闪电</h3>
        <p>从底层开始为速度打造，一切瞬间加载。</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🔒</div>
        <h3>默认安全</h3>
        <p>企业级安全，端到端加密。</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🔗</div>
        <h3>丰富集成</h3>
        <p>连接团队已在使用的 100 多款工具。</p>
      </div>
    </div>

    <div class="testimonial">
      <p class="testimonial-text">"这款产品彻底改变了我们团队的工作方式，生产力提升了 40%。"</p>
      <div class="testimonial-author">
        <div class="testimonial-avatar"></div>
        <div>
          <div class="testimonial-name">王丽娜</div>
          <div class="testimonial-role">高科集团产品负责人</div>
        </div>
      </div>
    </div>

  </div>
<script src="/docs-cn/impeccable-mirror/js/detect-antipatterns-browser.js"></script>

</html>
